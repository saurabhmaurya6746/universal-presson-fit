<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D6CD" />
      <stop offset="35%" stop-color="#E2A69A" />
      <stop offset="70%" stop-color="#C57B6E" />
      <stop offset="100%" stop-color="#8E4D43" />
    </linearGradient>

    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="30%" stop-color="#E6C875" />
      <stop offset="70%" stop-color="#C59B3F" />
      <stop offset="100%" stop-color="#946E19" />
    </linearGradient>

    <radialGradient id="softGaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9F6" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FBF4F0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F2E6E1" stop-opacity="0.2" />
    </radialGradient>

    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2A69A" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#E6C875" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2A69A" stop-opacity="0.1" />
    </linearGradient>

    <filter id="luxeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5C362C" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Luxe Border Ring -->
  <circle cx="250" cy="250" r="236" fill="url(#softGaze)" stroke="url(#roseGold)" stroke-width="2.5" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#champagneGold)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.85" />
  <circle cx="250" cy="250" r="216" fill="none" stroke="url(#roseGold)" stroke-width="0.75" opacity="0.6" />

  <!-- Orbital World Ellipses (Nail World Motif) -->
  <g id="orbital-world" filter="url(#shadowDepth)">
    <ellipse cx="250" cy="235" rx="175" ry="58" fill="none" stroke="url(#orbitGlow)" stroke-width="2.5" transform="rotate(-24 250 235)" />
    <ellipse cx="250" cy="235" rx="175" ry="58" fill="none" stroke="url(#champagneGold)" stroke-width="1" stroke-dasharray="8 5" opacity="0.7" transform="rotate(-24 250 235)" />
    <!-- Planet ring beads / pearls -->
    <circle cx="85" cy="275" r="4.5" fill="url(#champagneGold)" />
    <circle cx="415" cy="195" r="4.5" fill="url(#champagneGold)" />
    <circle cx="250" cy="177" r="3" fill="url(#roseGold)" />
  </g>

  <!-- Central Emblem: Elegant Manicured Hand & Almond Nail Silhouette -->
  <g id="nail-art-silhouette" transform="translate(250, 222) scale(1.05)" filter="url(#shadowDepth)">
    <!-- Central Starlight Diamond -->
    <path d="M 0,-82 Q 0,-40 22,-22 Q 40,0 82,0 Q 40,0 22,22 Q 0,40 0,82 Q 0,40 -22,22 Q -40,0 -82,0 Q -40,0 -22,-22 Q 0,-40 0,-82 Z" fill="none" stroke="url(#champagneGold)" stroke-width="1" opacity="0.4" />

    <!-- Stylized Manicured Hand / Fingers holding polished nail -->
    <!-- Center Almond Nail Tip Accent -->
    <path d="M -16,-55 C -20,-20 -24,20 -18,48 C -12,72 12,72 18,48 C 24,20 20,-20 16,-55 C 13,-72 -13,-72 -16,-55 Z" fill="url(#roseGold)" />
    <!-- Nail Polish Highlight -->
    <path d="M -10,-48 C -13,-20 -15,10 -11,35 C -9,45 -3,48 0,48 C -4,40 -5,10 -3,-25 C -2,-45 -6,-52 -10,-48 Z" fill="#FFF9F6" opacity="0.65" />

    <!-- Delicate Graceful Finger Silhouette Swirls -->
    <path d="M -54,32 C -46,0 -32,-30 -16,-55 C -4,-76 4,-76 16,-55 C 32,-30 46,0 54,32 C 60,56 42,76 22,76 C 5,76 0,60 -12,60 C -24,60 -28,76 -46,76 C -58,76 -60,48 -54,32 Z" fill="none" stroke="url(#roseGold)" stroke-width="2.5" stroke-linecap="round" />

    <!-- French Tip Arch -->
    <path d="M -15,-38 C -10,-48 10,-48 15,-38" fill="none" stroke="url(#champagneGold)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Petite Ring Band on finger -->
    <ellipse cx="0" cy="50" rx="20" ry="5.5" fill="none" stroke="url(#champagneGold)" stroke-width="2.2" />
    <circle cx="0" cy="44.5" r="3.2" fill="#FFFFFF" stroke="url(#champagneGold)" stroke-width="1.2" />
  </g>

  <!-- Sparkle Accents (Luxe Stars) -->
  <!-- Top Left Sparkle -->
  <g transform="translate(140, 130) scale(0.65)" filter="url(#luxeGlow)">
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="url(#champagneGold)" />
  </g>
  <!-- Top Right Sparkle -->
  <g transform="translate(355, 125) scale(0.85)" filter="url(#luxeGlow)">
    <path d="M 0,-28 Q 0,0 28,0 Q 0,0 0,28 Q 0,0 -28,0 Q 0,0 0,-28 Z" fill="url(#champagneGold)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
  <!-- Mid Right Petite Sparkle -->
  <g transform="translate(390, 260) scale(0.5)">
    <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="url(#roseGold)" />
  </g>
  <!-- Mid Left Petite Sparkle -->
  <g transform="translate(105, 230) scale(0.55)">
    <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="url(#roseGold)" />
  </g>

  <!-- Typography: Brand Name "NAIL WORLD" -->
  <text x="250" y="365" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="46" font-weight="700" letter-spacing="7" fill="#2C1814">
    NAIL WORLD
  </text>

  <!-- Ribbon / Divider Line -->
  <g transform="translate(250, 388)">
    <line x1="-120" y1="0" x2="-22" y2="0" stroke="url(#roseGold)" stroke-width="1.2" stroke-linecap="round" />
    <!-- Diamond Center -->
    <path d="M 0,-4.5 L 4.5,0 L 0,4.5 L -4.5,0 Z" fill="url(#champagneGold)" />
    <circle cx="-14" cy="0" r="1.8" fill="url(#champagneGold)" />
    <circle cx="14" cy="0" r="1.8" fill="url(#champagneGold)" />
    <line x1="22" y1="0" x2="120" y2="0" stroke="url(#roseGold)" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Subtitle: "LUXURY NAIL ATELIER & FIT" -->
  <text x="250" y="415" text-anchor="middle" font-family="'Manrope', -apple-system, sans-serif" font-size="12.5" font-weight="600" letter-spacing="4.5" fill="#7A564D">
    LUXURY NAIL ATELIER
  </text>
  <text x="250" y="434" text-anchor="middle" font-family="'Manrope', -apple-system, sans-serif" font-size="9.5" font-weight="500" letter-spacing="3" fill="#A88177">
    UNIVERSAL PERFECT FIT
  </text>
</svg>
